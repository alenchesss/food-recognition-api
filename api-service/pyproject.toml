[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # ошибки стиля
    "F",   # неиспользуемые импорты, переменные
    "I",   # сортировка импортов
    "B",   # типичные баги
    "UP",  # устаревший синтаксис
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
