# Pre-commit hooks configuration
#
# Для установки выполните:
#   pip install pre-commit
#   pre-commit install
#
# Перед первым коммитом и после изменений в этом файле также полезно прогнать:
#   pre-commit run --all-files

repos:
  # Базовые проверки: пробелы, переводы строк, валидность YAML и merge-конфликты
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: debug-statements

  # Линтер и форматтер
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Статический анализ типов для каждого сервиса отдельно
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (api-service)
        files: ^api-service/app/
        args: [--config-file=api-service/pyproject.toml]
        additional_dependencies:
          - pydantic==2.9.2
          - pydantic-settings==2.5.2
          - fastapi==0.115.0
          - httpx==0.27.2
      - id: mypy
        name: mypy (ml-service)
        files: ^ml-service/app/
        args: [--config-file=ml-service/pyproject.toml]
        additional_dependencies:
          - pydantic==2.9.2
          - fastapi==0.115.0
          - python-dotenv==1.0.1
      - id: mypy
        name: mypy (recipe-service)
        files: ^recipe-service/app/
        args: [--config-file=recipe-service/pyproject.toml]
        additional_dependencies:
          - pydantic==2.9.2
          - pydantic-settings==2.5.2
          - fastapi==0.115.0
          - httpx==0.27.2

  # Локальные хуки: запускают pytest для каждого сервиса перед коммитом.
  # Триггерятся только если в коммите есть изменения внутри директории сервиса.
  - repo: local
    hooks:
      - id: pytest-api-service
        name: pytest (api-service)
        entry: bash -c 'cd api-service && PYTHONPATH=. python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        files: ^api-service/
        stages: [pre-commit]

      - id: pytest-ml-service
        name: pytest (ml-service)
        entry: bash -c 'cd ml-service && PYTHONPATH=. python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        files: ^ml-service/
        stages: [pre-commit]

      - id: pytest-recipe-service
        name: pytest (recipe-service)
        entry: bash -c 'cd recipe-service && PYTHONPATH=. python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        files: ^recipe-service/
        stages: [pre-commit]
